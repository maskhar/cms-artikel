services:
  cms-artikel:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: https://supabase.carubra.com
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzgyMDU3ODE2LCJleHAiOjE5Mzk3Mzc4MTZ9.0tKWKzz1Y9Dr3H4fvae_KPv7dd6Io-5Tql46WPx0Y9U
    container_name: cms-artikel
    env_file:
      - .env.production
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3000"
    networks:
      - carubra-network
      - buzzerhood-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  carubra-network:
    external: true
  buzzerhood-network:
    external: true
