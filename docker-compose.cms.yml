services:
  cms-artikel:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
    container_name: cms-artikel
    env_file:
      - .env.production
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CMS_PORT:-3000}:3000"
    networks:
      - carubra-network
      - buzzerhood-network
      - soundpub-network
      - placers-network
      - maskhar-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  carubra-network:
    external: true
  buzzerhood-network:
    external: true
  soundpub-network:
    external: true
  placers-network:
    external: true
  maskhar-network:
    external: true
